<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3ED" />
  <meta name="description" content="Lumveria — Próximamente. Algo extraordinario está por comenzar." />
  <meta property="og:title" content="Lumveria — Próximamente" />
  <meta property="og:description" content="Algo extraordinario está por comenzar." />
  <meta property="og:type" content="website" />
  <title>Lumveria — Próximamente</title>

  <!-- Favicons de Lumveria -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    :root {
      --ivory: #f7f3ed;
      --ivory-2: #fbf9f6;
      --champagne: #d6b78c;
      --gold: #c79e5e;
      --bronze: #a6754a;
      --navy: #0b1b2b;
      --navy-soft: #1f2c3d;
      --line: rgba(166, 117, 74, 0.26);
      --shadow: rgba(11, 27, 43, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--navy);
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,0.95) 0%, rgba(251,249,246,0.88) 28%, rgba(247,243,237,0.96) 70%),
        linear-gradient(145deg, var(--ivory-2), var(--ivory));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        max(28px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      isolation: isolate;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
      z-index: -1;
    }

    .ambient {
      position: absolute;
      width: 44vw;
      max-width: 620px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(65px);
      opacity: 0.18;
      pointer-events: none;
      z-index: -2;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .ambient.one {
      left: -18vw;
      bottom: -20vw;
      background: radial-gradient(circle, rgba(214,183,140,0.72), transparent 66%);
    }

    .ambient.two {
      top: -24vw;
      right: -16vw;
      background: radial-gradient(circle, rgba(199,158,94,0.46), transparent 70%);
      animation-delay: -5s;
    }

    .curve {
      position: absolute;
      width: min(34vw, 520px);
      height: min(70vh, 760px);
      pointer-events: none;
      opacity: 0.58;
    }

    .curve svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .curve.left {
      left: -4vw;
      bottom: -7vh;
      transform: rotate(2deg);
    }

    .curve.right {
      right: -5vw;
      top: -8vh;
      transform: rotate(180deg);
    }

    main {
      width: min(880px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(-1.5vh);
    }

    .brand-mark {
      position: relative;
      width: clamp(142px, 16vw, 220px);
      filter: drop-shadow(0 18px 22px var(--shadow));
      animation: reveal 1.1s cubic-bezier(.2,.8,.2,1) both,
                 breathe 5.6s ease-in-out 1.2s infinite;
    }

    .brand-mark svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .glint {
      position: absolute;
      top: 24%;
      right: 11%;
      width: 18px;
      height: 18px;
      opacity: 0;
      transform: scale(.3) rotate(0deg);
      animation: sparkle 5.8s ease-in-out 1.8s infinite;
    }

    .glint::before,
    .glint::after {
      content: "";
      position: absolute;
      inset: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), transparent);
      border-radius: 999px;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 18px rgba(255,255,255,.8);
    }

    .glint::before {
      width: 26px;
      height: 2px;
    }

    .glint::after {
      width: 2px;
      height: 26px;
    }

    .wordmark {
      margin-top: clamp(18px, 2.4vw, 28px);
      font-size: clamp(2.2rem, 5.6vw, 5rem);
      font-weight: 400;
      letter-spacing: .24em;
      line-height: .95;
      margin-left: .24em;
      color: var(--navy);
      animation: reveal 1s .18s cubic-bezier(.2,.8,.2,1) both;
    }

    .tagline {
      margin-top: clamp(14px, 2vw, 22px);
      font-size: clamp(.72rem, 1.2vw, 1rem);
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--bronze);
      animation: reveal .9s .34s cubic-bezier(.2,.8,.2,1) both;
    }

    .divider {
      margin: clamp(26px, 4vh, 44px) 0 clamp(22px, 3.2vh, 34px);
      width: min(250px, 52vw);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      animation: reveal .9s .5s cubic-bezier(.2,.8,.2,1) both;
    }

    .divider span {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--champagne));
    }

    .divider span:last-child {
      background: linear-gradient(90deg, var(--champagne), transparent);
    }

    .divider i {
      width: 7px;
      height: 7px;
      background: var(--champagne);
      transform: rotate(45deg);
      box-shadow: 0 0 16px rgba(214,183,140,.72);
    }

    .coming {
      margin: 0;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 4.1vw, 3.55rem);
      font-weight: 500;
      letter-spacing: .22em;
      line-height: 1;
      margin-left: .22em;
      text-transform: uppercase;
      color: var(--navy);
      animation: reveal .95s .62s cubic-bezier(.2,.8,.2,1) both;
    }

    .message {
      margin: clamp(16px, 2.5vh, 26px) 0 0;
      font-size: clamp(.78rem, 1.4vw, 1.06rem);
      font-weight: 500;
      letter-spacing: .28em;
      line-height: 1.75;
      text-transform: uppercase;
      color: var(--bronze);
      animation: reveal .95s .78s cubic-bezier(.2,.8,.2,1) both;
    }

    .domain {
      margin-top: clamp(28px, 4.2vh, 48px);
      font-size: clamp(.7rem, 1.15vw, .92rem);
      letter-spacing: .38em;
      text-transform: uppercase;
      color: rgba(166,117,74,.9);
      animation: reveal .95s .94s cubic-bezier(.2,.8,.2,1) both;
    }

    .bottom-line {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(220px, 42vw);
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(199,158,94,.56), transparent);
      animation: reveal 1s 1.1s both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes breathe {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.012); }
    }

    @keyframes sparkle {
      0%, 68%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
      74% { opacity: 1; transform: scale(1.2) rotate(45deg); }
      82% { opacity: 0; transform: scale(.5) rotate(90deg); }
    }

    @keyframes drift {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(3vw,-2vh,0) scale(1.08); }
    }

    @media (max-width: 640px) {
      .page {
        padding-inline: 22px;
      }

      main {
        width: min(100%, 560px);
        transform: translateY(-2vh);
      }

      .wordmark {
        letter-spacing: .18em;
        margin-left: .18em;
      }

      .tagline {
        max-width: 100%;
        letter-spacing: .22em;
        line-height: 1.6;
      }

      .coming {
        letter-spacing: .16em;
        margin-left: .16em;
      }

      .message {
        max-width: 92%;
        letter-spacing: .18em;
      }

      .curve {
        width: 58vw;
        opacity: .43;
      }

      .curve.left {
        left: -18vw;
        bottom: -11vh;
      }

      .curve.right {
        right: -19vw;
        top: -11vh;
      }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      .brand-mark {
        width: 112px;
      }

      .wordmark {
        margin-top: 12px;
        font-size: clamp(2rem, 5vw, 3.8rem);
      }

      .tagline {
        margin-top: 10px;
      }

      .divider {
        margin: 16px 0 14px;
      }

      .domain {
        margin-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="grain" aria-hidden="true"></div>
    <div class="ambient one" aria-hidden="true"></div>
    <div class="ambient two" aria-hidden="true"></div>

    <div class="curve left" aria-hidden="true">
      <svg viewBox="0 0 420 760" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-40 745C76 698 138 625 169 526C206 409 214 242 454 82" stroke="#C79E5E" stroke-opacity=".58"/>
        <path d="M-56 758C64 707 128 632 158 530C194 411 201 236 443 70" stroke="#D6B78C" stroke-opacity=".50"/>
        <path d="M-72 770C52 715 116 638 147 534C182 414 188 231 432 58" stroke="#C79E5E" stroke-opacity=".40"/>
        <path d="M-88 782C40 723 105 645 136 539C170 417 175 226 421 46" stroke="#D6B78C" stroke-opacity=".30"/>
      </svg>
    </div>

    <div class="curve right" aria-hidden="true">
      <svg viewBox="0 0 420 760" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-40 745C76 698 138 625 169 526C206 409 214 242 454 82" stroke="#C79E5E" stroke-opacity=".58"/>
        <path d="M-56 758C64 707 128 632 158 530C194 411 201 236 443 70" stroke="#D6B78C" stroke-opacity=".50"/>
        <path d="M-72 770C52 715 116 638 147 534C182 414 188 231 432 58" stroke="#C79E5E" stroke-opacity=".40"/>
        <path d="M-88 782C40 723 105 645 136 539C170 417 175 226 421 46" stroke="#D6B78C" stroke-opacity=".30"/>
      </svg>
    </div>

    <main>
      <div class="brand-mark" aria-label="Logotipo de Lumveria">
        <svg viewBox="0 0 240 248" role="img" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldMain" x1="55" y1="18" x2="196" y2="228" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F1D5AA"/>
              <stop offset=".34" stop-color="#D6A664"/>
              <stop offset=".72" stop-color="#A6754A"/>
              <stop offset="1" stop-color="#C79E5E"/>
            </linearGradient>
            <linearGradient id="goldEdge" x1="31" y1="22" x2="176" y2="222" gradientUnits="userSpaceOnUse">
              <stop stop-color="#EBCB9A"/>
              <stop offset=".56" stop-color="#B98250"/>
              <stop offset="1" stop-color="#8E603E"/>
            </linearGradient>
          </defs>

          <!-- Geometric LV monogram -->
          <path d="M44 18H72V120L121 190L107 212L44 126V18Z" fill="url(#goldEdge)"/>
          <path d="M72 111H99L136 164L122 186L72 115V111Z" fill="url(#goldMain)"/>
          <path d="M96 64H126L148 96L133 119L96 64Z" fill="url(#goldMain)"/>
          <path d="M185 66H214L138 222L119 194L185 66Z" fill="url(#goldMain)"/>
          <path d="M164 66H188L127 189L113 168L164 66Z" fill="url(#goldMain)"/>
          <path d="M140 206L154 228L173 190L159 169L140 206Z" fill="url(#goldEdge)"/>
        </svg>
        <span class="glint" aria-hidden="true"></span>
      </div>

      <div class="wordmark">LUMVERIA</div>
      <div class="tagline">Conecta. Crea. Transforma.</div>

      <div class="divider" aria-hidden="true">
        <span></span><i></i><span></span>
      </div>

      <h1 class="coming">Próximamente</h1>
      <p class="message">Algo extraordinario está por comenzar.</p>
      <div class="domain">lumveria.com</div>
    </main>

    <div class="bottom-line" aria-hidden="true"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conectar WhatsApp Business | Lumveria</title>

  <link rel="icon" href="/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #fbf9f6 0%, #f7f3ed 45%, #eee7dd 100%);
      color: #1f2c3d;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(166,117,74,.18);
      border-radius: 24px;
      padding: 42px;
      box-shadow: 0 20px 60px rgba(31,44,61,.12);
      text-align: center;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a6754a;
      margin-bottom: 16px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 34px;
      line-height: 1.15;
    }

    p {
      color: #5b6470;
      line-height: 1.6;
      margin: 0 auto 28px;
      max-width: 500px;
    }

    button {
      width: 100%;
      max-width: 380px;
      border: 0;
      border-radius: 14px;
      padding: 16px 22px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #1f2c3d;
      color: white;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .info {
      display: block !important;
      background: #f5f2ed;
      color: #4c5663;
    }

    .success {
      display: block !important;
      background: #edf8f1;
      color: #176b3a;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #9b2c2c;
    }

    .privacy {
      margin-top: 26px;
      font-size: 12px;
      color: #8a8f96;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">Lumveria AI</div>

    <h1>Conecta tu WhatsApp Business</h1>

    <p>
      Vincula tu cuenta existente de WhatsApp Business con Lumveria
      para activar automatización e inteligencia artificial sin dejar
      de utilizar WhatsApp Business en tu teléfono.
    </p>

    <button id="connectButton" onclick="launchWhatsAppSignup()">
      Conectar WhatsApp Business
    </button>

    <div id="status"></div>

    <div class="privacy">
      La conexión se realiza mediante la plataforma oficial de Meta.
    </div>

  </div>


  <script>
    /*
      APP ID DE LUMVERIA AI
      El App ID no es un secreto.
    */
    const META_APP_ID = "2640685283048175";

    /*
      PEGA ENTRE LAS COMILLAS EL CONFIGURATION ID
      QUE ACABAS DE CREAR EN META.
    */
    const META_CONFIG_ID = "1563110535613754";


    const statusBox = document.getElementById("status");
    const connectButton = document.getElementById("connectButton");


    function setStatus(message, type = "info") {
      statusBox.textContent = message;
      statusBox.className = type;
    }


    /*
      ESCUCHA EL RESULTADO DE WHATSAPP EMBEDDED SIGNUP
    */
    window.addEventListener("message", function(event) {

      try {

        const url = new URL(event.origin);

        const validFacebookOrigin =
          url.hostname === "facebook.com" ||
          url.hostname.endsWith(".facebook.com");

        if (!validFacebookOrigin) return;

      } catch {
        return;
      }


      let data = event.data;

      if (typeof data === "string") {
        try {
          data = JSON.parse(data);
        } catch {
          return;
        }
      }


      if (!data || data.type !== "WA_EMBEDDED_SIGNUP") {
        return;
      }


      console.log("WhatsApp Embedded Signup event:", data);


      if (
        data.event === "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING" ||
        data.event === "FINISH"
      ) {

        const wabaId = data.data?.waba_id || "";
        const phoneNumberId = data.data?.phone_number_id || "";

        let message = "✅ WhatsApp Business se conectó correctamente.";

        if (wabaId) {
          message += " WABA ID recibido.";
        }

        if (phoneNumberId) {
          message += " Phone Number ID recibido.";
        }

        setStatus(message, "success");

      } else if (data.event === "CANCEL") {

        setStatus(
          "La conexión fue cancelada. Puedes intentarlo nuevamente.",
          "info"
        );

      } else if (data.event === "ERROR") {

        setStatus(
          "Meta reportó un error durante la conexión.",
          "error"
        );

      }

    });


    /*
      INICIALIZA FACEBOOK JAVASCRIPT SDK
    */
    window.fbAsyncInit = function() {

      FB.init({
        appId: META_APP_ID,
        cookie: true,
        xfbml: true,
        version: "v26.0"
      });

      console.log("Meta SDK listo.");

    };


    /*
      ABRE WHATSAPP EMBEDDED SIGNUP
      EN MODO COEXISTENCE
    */
    function launchWhatsAppSignup() {

      if (
        !META_CONFIG_ID ||
        META_CONFIG_ID === "PEGA_AQUI_TU_CONFIGURATION_ID"
      ) {

        setStatus(
          "Primero debes agregar tu Configuration ID de Meta.",
          "error"
        );

        return;
      }


      if (typeof FB === "undefined") {

        setStatus(
          "El SDK de Meta todavía no está listo. Intenta nuevamente.",
          "error"
        );

        return;
      }


      connectButton.disabled = true;

      setStatus(
        "Abriendo la conexión segura con Meta…",
        "info"
      );


      FB.login(

        function(response) {

          connectButton.disabled = false;


          if (response.authResponse?.code) {

            /*
              IMPORTANTE:
              El código de autorización debe enviarse después
              a nuestro backend / Cloudflare Worker.

              NO pondremos App Secret ni tokens privados
              dentro de este archivo HTML.
            */

            console.log(
              "Authorization code recibido correctamente."
            );

            setStatus(
              "Autorización recibida. Esperando que Meta termine de conectar WhatsApp Business…",
              "info"
            );

          } else {

            setStatus(
              "La autorización no se completó o fue cancelada.",
              "info"
            );

          }

        },

        {
          config_id: META_CONFIG_ID,

          response_type: "code",

          override_default_response_type: true,

          extras: {

            setup: {},

            /*
              ESTA LÍNEA ACTIVA COEXISTENCE:
              WhatsApp Business App + Cloud API
            */
            featureType: "whatsapp_business_app_onboarding",

            sessionInfoVersion: "3"
          }
        }

      );

    }

  </script>


  <!-- META JAVASCRIPT SDK -->
  <script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js">
  </script>

</body>
</html>
